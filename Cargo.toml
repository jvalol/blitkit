[package]
name = "blitzkit"
version = "0.3.0"
authors = ["Jake Van Alstyne 🎩 <jake.van.alstyne@hey.com>"]
edition = "2018"
rust-version = "1.87"
description = "A small 2D and 3D game engine over wgpu: meshes, textures, lighting, shadows, collision, text and sound"
repository = "https://github.com/jvalol/blitzkit"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["gamedev", "graphics", "wgpu", "3d", "engine"]
categories = ["game-engines", "graphics"]
# the old name's final release lives here; it is not part of this crate
exclude = ["farewell"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
winit = "0.30"
glam = { version = "0.33", features = ["bytemuck"] }
tobj = "4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
env_logger = "0.11"
log = "0.4"
wgpu = "30"
wgpu_text = "30"
pollster = "1"
bytemuck = "1.4"
rodio = { version = "0.22", default-features = false, features = ["playback"] }

[dev-dependencies]
glam = "0.33"
