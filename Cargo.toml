[package]
name = "blitkit"
version = "0.1.0"
authors = ["Jake Van Alstyne 🎩 <jake.van.alstyne@hey.com>"]
edition = "2018"
rust-version = "1.87"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
winit = "0.30"
cgmath = "0.17"
env_logger = "0.11"
log = "0.4"
wgpu = "30"
wgpu_text = "30"
pollster = "1"
bytemuck = "1.4"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
