<div class="book-columns flex flex-wrap">
  {{ range split .Inner "<--->" }}
  <div class="flex-even markdown-inner">
    {{/* RenderString, not markdownify: it keeps the page context so image
       render hooks can resolve bundle resources */}}
    {{ $.Page.RenderString (dict "display" "block") . }}
  </div>
  {{ end }}
</div>
